# Hyprland Config Example

# Monitor Setup (adjust resolution & position as needed)
monitor = eDP-1,1920x1080@60,0x0,1

# Launch apps on startup
exec-once = waybar
exec-once = swaybg -i ~/Pictures/wallpaper.jpg -m fill
exec-once = xdg-user-dirs-update

# Input (keyboard/mouse/touchpad)
input {
  kb_layout = us
  follow_mouse = 1
  touchpad {
    natural_scroll = yes
  }
}

# General Settings
general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2
  col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
  col.inactive_border = rgba(595959aa)
  layout = dwindle
}

# Decoration (shadows, rounding)
decoration {
  rounding = 10
  blur {
    enabled = true
    size = 4
    passes = 2
  }
  drop_shadow = yes
  shadow_range = 20
  shadow_render_power = 3
  col.shadow = rgba(000000aa)
}

# Animations
animations {
  enabled = yes
  bezier = ease, 0.25, 0.1, 0.25, 1
  animation = windows, 1, 7, ease
  animation = fade, 1, 7, ease
  animation = workspaces, 1, 6, ease
}

# Keybindings
bind = SUPER, RETURN, exec, kitty
bind = SUPER, D, exec, wofi --show drun
bind = SUPER, Q, killactive
bind = SUPER, F, togglefloating
bind = SUPER, SPACE, togglefloating
bind = SUPER, S, togglesplit
bind = SUPER, V, exec, thunar

# Move focus
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

# Resize (Hold SUPER+ALT then arrow keys)
bind = SUPER ALT, H, resizeactive, -20 0
bind = SUPER ALT, L, resizeactive, 20 0
bind = SUPER ALT, K, resizeactive, 0 -20
bind = SUPER ALT, J, resizeactive, 0 20

# Workspace Switching
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5

# Move window to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3

# Screenshot (requires grim & slurp)
bind = SUPER, P, exec, grim -g "$(slurp)" - | wl-copy
